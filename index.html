<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Worlds</title>
<!--
  DESIGN WORLDS — a library of live UI "worlds".
  This file is only the shell. Everything else is modular:

    designs/<id>/   one folder per design (design.json, sample.html, sample.css, sample.js, DESIGN.md)
    app/            the gallery itself (search, filters, detail view)
    data/           generated by `node scripts/build.mjs`, do not edit
    scripts/        build.mjs, new.mjs

  Add a design:  node scripts/new.mjs my-world "My World"   then   node scripts/build.mjs
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/app.css">
</head>
<body>

<header class="top">
  <a class="top__brand" href="#/" aria-label="Design Worlds, all designs">Design Worlds</a>
  <form class="search" role="search" id="search-form" autocomplete="off">
    <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
    <input id="q" type="search" placeholder="Search by name, use, feel, colour, font…" aria-label="Search designs" spellcheck="false">
    <kbd class="search__kbd" aria-hidden="true">/</kbd>
  </form>
  <button class="btn btn--quiet" type="button" id="theme" aria-label="Colour theme">Theme</button>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/manifest.js"></script>
<script src="app/search.js"></script>
<script src="app/detail.js"></script>
<script src="app/app.js"></script>
</body>
</html>
