<div class="stage sm-s" id="sm-stage" data-state="idle">
  <header class="sm-s__bar">
    <b>Tsuki <span>Tea House</span></b>
    <span>Kyoto · open at dusk</span>
  </header>
  <div class="sm-s__body">
    <div class="sm-s__enso" aria-live="polite">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <filter id="sm-rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
          </filter>
        </defs>
        <g filter="url(#sm-rough)" fill="none" stroke-linecap="round">
          <circle class="sm-s__ring" cx="100" cy="100" r="76" pathLength="100" transform="rotate(-70 100 100)" id="sm-ring" />
          <circle class="sm-s__dry" cx="100" cy="100" r="80" pathLength="100" transform="rotate(-72 100 100)" id="sm-dry" />
        </g>
      </svg>
      <div class="sm-s__time">
        <small id="sm-temp">80°C</small>
        <b id="sm-clock">1:30</b>
        <span id="sm-state">Sencha</span>
      </div>
    </div>
    <div class="sm-s__side">
      <p class="sm-s__vert" lang="ja" aria-hidden="true">一期一会</p>
      <h4 class="sm-s__title">Slow down to the speed of <em>steam</em>.</h4>
      <ul class="sm-s__teas" id="sm-teas" role="radiogroup" aria-label="Choose a tea">
        <li><button type="button" role="radio" aria-checked="true" data-t="Sencha" data-c="80" data-s="90">Sencha<small>Green · 80°C · 1:30</small></button></li>
        <li><button type="button" role="radio" aria-checked="false" data-t="Gyokuro" data-c="60" data-s="120">Gyokuro<small>Shaded · 60°C · 2:00</small></button></li>
        <li><button type="button" role="radio" aria-checked="false" data-t="Hojicha" data-c="95" data-s="45">Hojicha<small>Roasted · 95°C · 0:45</small></button></li>
      </ul>
      <div class="sm-s__row">
        <button class="sm-s__btn" type="button" id="sm-go">Begin steeping</button>
        <span class="sm-s__seal" id="sm-seal" aria-hidden="true">茶</span>
      </div>
    </div>
  </div>
</div>
